version: '3.9'

# scarlet-composer app - composer-api (FastAPI) + composer-ui (Next.js),
# combined into one container (see docker/composer-app/Dockerfile).
# Mirrors Gustavo's own docker-compose.yml pattern: build from source here,
# only the Next.js UI port exposed, FastAPI internal-only.
#
# Points at an *external* Redis (REDIS_HOST/PORT/AUTH_TOKEN) - same shared
# instance any other scarlet-agentic-harness agent on this deployment uses,
# not a private one, so the Scarlets/Agents tracker reflects real state.

services:
  scarlet-composer-app:
    build:
      context: ../..
      dockerfile: docker/composer-app/Dockerfile
    container_name: scarlet-composer-app
    restart: unless-stopped
    ports:
      - "8501:3000"   # Next.js UI - kept on 8501 to replace the old Streamlit UI's port.
    volumes:
      - ./config:/etc/scarlet-composer   # composer_api.yaml (GUSTAVO_API_URL) persistence
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_AUTH_TOKEN=${REDIS_AUTH_TOKEN}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      # Signs/encrypts composer session tokens (only used when AUTH_ENABLED=true).
      # Pin this for a real deployment - unset means a random secret is
      # generated at startup and every restart invalidates existing sessions.
      - COMPOSER_SESSION_SECRET=${COMPOSER_SESSION_SECRET:-}
      - COMPOSER_API_CONFIG=/etc/scarlet-composer/composer_api.yaml
      # Where composer-api delegates real login checks to (see composer-api/
      # routers/auth.py) - server-to-server call, not user-facing. Reachable
      # via host.docker.internal since Gustavo runs in a separate compose
      # project's network, not this one.
      - GUSTAVO_API_URL=${GUSTAVO_API_URL:-http://host.docker.internal:3002}
      - PYTHONWARNINGS=ignore
    extra_hosts:
      - "host.docker.internal:host-gateway"
