version: '3.9'

# scarlet-composer app - composer-api (FastAPI) + composer-ui (Next.js),
# combined into one container (see docker/composer-app/Dockerfile).
# Mirrors Gustavo's own docker-compose.yml pattern: build from source here,
# only the Next.js UI port exposed, FastAPI internal-only.
#
# Points at an *external* Redis (REDIS_HOST/PORT/AUTH_TOKEN) - same shared
# instance any other scarlet-agentic-harness agent on this deployment uses,
# not a private one, so the Scarlets/Agents tracker reflects real state.

services:
  scarlet-composer-app:
    build:
      context: ../..
      dockerfile: docker/composer-app/Dockerfile
      args:
        # NEXT_PUBLIC_AUTH_ENABLED is baked into the Next.js bundle at build
        # time. Inherits AUTH_ENABLED so one variable controls both sides -
        # same convention as Gustavo's own docker-compose.yml.
        - NEXT_PUBLIC_AUTH_ENABLED=${AUTH_ENABLED:-false}
    image: scarlet-composer-app:local
    container_name: scarlet-composer-app
    restart: unless-stopped
    ports:
      - "8501:3000"   # Next.js UI - kept on 8501 to replace the old Streamlit UI's port.
    volumes:
      - ./config:/etc/scarlet-composer   # composer_api.yaml (GUSTAVO_API_URL) persistence
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_AUTH_TOKEN=${REDIS_AUTH_TOKEN}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      # Signs/encrypts composer session tokens (only used when AUTH_ENABLED=true).
      # Pin this for a real deployment - unset means a random secret is
      # generated at startup and every restart invalidates existing sessions.
      - COMPOSER_SESSION_SECRET=${COMPOSER_SESSION_SECRET:-}
      - COMPOSER_API_CONFIG=/etc/scarlet-composer/composer_api.yaml
      # Where composer-api delegates real login checks to (see composer-api/
      # routers/auth.py) - server-to-server call, not user-facing. Reachable
      # via host.docker.internal since Gustavo runs in a separate compose
      # project's network, not this one.
      - GUSTAVO_API_URL=${GUSTAVO_API_URL:-http://host.docker.internal:3002}
      - PYTHONWARNINGS=ignore
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Node identity resolution (getNodeIp/getNodeInfo) - required for any real
  # multi-node deployment: without it, an agent that doesn't have NODE_ADDRESS
  # set explicitly can't resolve its own identity, so AGENT_ID
  # ({APP_ID}_{NODE_ADDRESS}) and every scarlet key an agent registers falls
  # back to an unstable/wrong value instead of its real Nebula-managed
  # address - this is why it's part of every composer deployment, not
  # optional add-on tooling.
  #
  # Reuses the exact same image as scarlet-composer-app (background_server.py
  # is already baked in) with a command override - no separate image to
  # build or publish. network_mode: host is deliberate, not incidental: this
  # only works correctly if agent containers connecting to it (potentially
  # on the same host, not just remote machines) see their own real source
  # IP rather than a NAT'd/masqueraded one - verified empirically against
  # bridge+published-port, which collapses every same-host caller to the
  # docker bridge gateway's IP. See background_server.py's own docstring for
  # what it actually runs (scarletcomposer's existing, unmodified
  # BackgroundServer.py - not a reimplementation).
  background-server:
    image: scarlet-composer-app:local
    container_name: scarlet-composer-background-server
    restart: unless-stopped
    network_mode: host
    command: ["python", "/app/docker/composer-app/background_server.py"]
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_AUTH_TOKEN=${REDIS_AUTH_TOKEN}
      # A separate trio from MANAGER_HOST/PORT (which is how an *agent*
      # reaches this service) - this is how *this service itself* reaches
      # the real Nebula Manager to resolve device_group when the
      # node-aliases Redis map doesn't already have one cached. Optional -
      # device_group falls back to the DEVICE_GROUP env var / "default" if
      # unset. See scarletcomposer/pages/config/BackgroundServer.py.
      - MANAGER_CONTAINER_HOST=${MANAGER_CONTAINER_HOST:-}
      - MANAGER_CONTAINER_PORT=${MANAGER_CONTAINER_PORT:-}
      - MANAGER_CONTAINER_AUTH_TOKEN=${MANAGER_CONTAINER_AUTH_TOKEN:-}
    depends_on:
      - scarlet-composer-app
