[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:composer-api]
command=/opt/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000
directory=/app/composer-api
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:composer-ui]
command=node /app/composer-ui/.next/standalone/server.js
directory=/app/composer-ui/.next/standalone
environment=HOSTNAME="0.0.0.0",FASTAPI_URL="http://127.0.0.1:8000"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
