version: '3.9'

# Scarlet Composer Studio — LLM agent fleet tutorial
#
# Fully self-contained, unlike examples/notebooks (bring your own Redis):
# this brings up its own Redis and its own Composer UI (auth disabled)
# alongside the Jupyter environment - nothing external required beyond an
# LLM endpoint/key, which notebook 06 itself asks for interactively.
#
# The tutorial agent fleet (one head, two workers) is NOT started by this
# compose file at all - notebook 06 launches them itself, via the Docker
# SDK, once you provide LLM credentials inside the notebook. That's why
# the jupyter service below needs the Docker socket mounted in - see
# docker/jupyter-agents/Dockerfile's own comment for why this lives in a
# separate image from examples/notebooks' plain SDK tutorials.
#
# Usage:
#   cp .env.example .env          # fill in REDIS_AUTH_TOKEN at minimum
#   docker compose up --build -d
#
# Then open http://localhost:8888 for JupyterLab (notebook 06) and
# http://localhost:8501 for the Composer UI, to watch agents register in
# real time as the notebook brings them up.

services:

  # ─── Redis ───────────────────────────────────────────────────────────────
  # Host port offset from the default 6379 - deliberately, so this doesn't
  # clash with a real Redis instance that might already be running locally.
  redis:
    image: redis:7.4-alpine
    container_name: notebook-agents-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_AUTH_TOKEN}"]
    ports:
      - "6380:6379"

  # ─── Composer UI ─────────────────────────────────────────────────────────
  # AUTH_ENABLED=false so there's nothing to log into - this is a local
  # tutorial stack, not a real multi-user deployment. Watch the Agents tab
  # here while notebook 06 brings its fleet up.
  scarlet-composer:
    build:
      context: ../..
      dockerfile: docker/composer-app/Dockerfile
      args:
        NEXT_PUBLIC_AUTH_ENABLED: "false"
    container_name: notebook-agents-composer
    restart: unless-stopped
    ports:
      - "8501:3000"
    environment:
      - AUTH_ENABLED=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH_TOKEN=${REDIS_AUTH_TOKEN}
    depends_on:
      - redis

  # ─── The tutorial notebook ───────────────────────────────────────────────
  # Built from docker/jupyter-agents/Dockerfile (extends scarlet-agents,
  # not scarlet-agent-base - see that Dockerfile's own comment for why).
  # The Docker socket mount and HOST_PROJECT_DIR are both specifically for
  # notebook 06 launching real sibling containers - see its own first
  # cells for exactly how and why each is used.
  jupyter:
    build:
      context: ../..
      dockerfile: docker/jupyter-agents/Dockerfile
    container_name: notebook-agents-jupyter
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH_TOKEN=${REDIS_AUTH_TOKEN}
      # docker compose evaluates ${PWD} on the host, at compose-file-parse
      # time - not inside any container - so this is the real host path to
      # this directory, needed to bind-mount CSVs into sibling containers
      # the notebook launches (a bind-mount source is resolved by the
      # Docker daemon, not by the jupyter container - see the notebook's
      # own explanation of this).
      - HOST_PROJECT_DIR=${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data:ro
    depends_on:
      - redis
