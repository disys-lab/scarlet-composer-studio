version: '3.9'

# Scarlet Composer Studio — local quickstart
#
# Starts two services against an external Redis instance:
#   1. scarlet-composer — composer-api (FastAPI) + composer-ui (Next.js), port 8501
#   2. hello-agent      — sample Scarlet agent; echoes messages on two Messenger buses
#
# APP_ID, NODE_ADDRESS, DEVICE_GROUP, and HEAD_BUS are set directly as env vars.
# Gustavo is not required for local development — it is only needed for multi-node
# edge deployments where agents must be pushed to remote machines via Nebula. Node
# identity resolution (background-server) is likewise not needed here since
# NODE_ADDRESS is set explicitly below - see deployment/docker.md for running it
# as a third service in a real multi-node deployment.
#
# Usage:
#   cp .env.example .env          # fill in REDIS_HOST, REDIS_AUTH_TOKEN
#
#   # scarlet-composer's Dockerfile consumes pre-built wheels from the repo
#   # root's dist/ rather than building them itself - build them once first
#   # (from the repo root, three levels up from here):
#   cd ../.. && python3 setup.py bdist_wheel && python3 setup_composer.py bdist_wheel && cd examples/quickstart
#
#   docker compose up --build -d
#   python3 smoke_test.py --env .env
#
# After the stack is running, open http://localhost:8501 for the Composer UI.

services:

  # ─── Scarlet Composer Studio UI ────────────────────────────────────────────
  # Built locally from this repo's own docker/composer-app/Dockerfile (build
  # context is the repo root, three levels up) rather than a pinned ghcr.io
  # tag - see deployment/docker.md for the CI-published image, once a release
  # has been tagged.
  scarlet-composer:
    build:
      context: ../..
      dockerfile: docker/composer-app/Dockerfile
      args:
        NEXT_PUBLIC_AUTH_ENABLED: "false"
    container_name: scarlet-composer
    restart: unless-stopped
    ports:
      - "8501:3000"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Sample hello-agent ────────────────────────────────────────────────────
  # A minimal Scarlet agent: registers on two Messenger buses, echoes incoming
  # messages, and broadcasts a heartbeat every 60 s.
  # Built locally from hello_agent/Dockerfile (extends scarlet-agent-base).
  hello-agent:
    build:
      context: hello_agent
      dockerfile: Dockerfile
    container_name: hello-agent
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_ID=hello-agent
      - NODE_ADDRESS=local
      - HEAD_BUS=quickstart_headagent
      - DEVICE_GROUP=quickstart_subagent
    extra_hosts:
      - "host.docker.internal:host-gateway"
