# Scarlet Composer Studio — notebook tutorials
#
# The single compose file for all six notebooks. Every service runs a
# published ghcr.io image - nothing is built locally, so this file works on
# its own with no repo checkout beyond itself and .env.
#
# ─── Two groups of services ────────────────────────────────────────────────
#
#   default    redis, scarlet-composer, jupyter   - the tutorial environment
#   "agents"   agent-head, agent-worker1/2        - notebook 06's fleet
#
# The agent services carry `profiles: ["agents"]`, so plain `docker compose
# up` skips them entirely. Notebook 06 brings them in on demand by running
# `docker compose --profile agents up -d` against this same file, which it
# can see because the jupyter service bind-mounts this directory in at
# /workspace.
#
# ─── Usage ─────────────────────────────────────────────────────────────────
#
#   cp .env.example .env     # fill in REDIS_AUTH_TOKEN and the LLM_* values
#   docker compose up -d
#
# Then http://localhost:8888 for JupyterLab and http://localhost:8501 for
# the Composer UI, where you can watch agents register as notebook 06
# brings its fleet up.
#
# Notebooks 01-05 need nothing beyond the default services, and only 06
# needs the LLM_* values - leave those blank if you are not running it.
#
# ─── This mirrors the Gustavo deployment deliberately ──────────────────────
#
# gustavo-app.yaml next to this file describes the same topology for real
# nodes, and the two are kept structurally identical so the notebook runs
# unmodified in both:
#
#   * Head and workers are separate deployments with separate APP_IDs, so
#     agent ids cannot be composed from one shared value. HEAD_APP_ID and
#     WORKER_APP_ID are set here to the same names Gustavo would assign
#     from its app names, and the notebook derives ids the same way in
#     both cases.
#   * HEAD_BUS and DEVICE_GROUP are set explicitly and identically on every
#     service, rather than left to the f"{app_id}_..." defaults, which
#     would put head and workers on different buses.
#   * ACTIVITY_MAPPER is shared, so in-flight activity from every worker
#     lands in one Mapper rather than fragmenting per app.
#   * The notebook writes each worker's CSV into a location the workers
#     read from - a named volume here, a shared host directory under
#     Gustavo. Same contract, different mechanism.

# Pinned so the `docker compose --profile agents up` that notebook 06 runs
# from inside the jupyter container joins THIS project - same network, same
# running redis - instead of starting a second, isolated stack. Compose
# derives the project name from the directory name by default, and that
# directory is /workspace inside the container but examples/notebooks on
# the host; without this they would not agree.
name: scarlet-notebooks

# ─── A note on the repetition below ─────────────────────────────────────────
# The agent services share most of their configuration and would be an
# obvious candidate for a YAML anchor. Verified directly that this does NOT
# work here: the Compose build shipped inside the jupyter image fails to
# resolve anchors declared under a top-level x- field, rejecting the file
# with "unknown anchor" - while the Compose on the host parses the same file
# fine. Since notebook 06 runs `docker compose` from INSIDE that container,
# the stricter parser is the binding constraint, so these are written out in
# full. A file that only works depending on which Compose reads it is worse
# than a repetitive one.

services:

  # ─── Redis ─────────────────────────────────────────────────────────────────
  # Self-hosted so the tutorial needs nothing external. Host port is offset
  # from 6379 on purpose so it does not collide with a Redis already running
  # locally; inside the compose network everything still talks to it on 6379.
  redis:
    image: redis:7.4-alpine
    container_name: scarlet-notebooks-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_AUTH_TOKEN}"]
    ports:
      - "6380:6379"
    # A real volume, matching gustavo-app.yaml's own. Without one Redis
    # writes its RDB snapshot into the container layer, and when that fills
    # it refuses ALL writes ("MISCONF ... unable to persist to disk") while
    # reads keep working - so agents still look online while every dispatch
    # silently fails.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH_TOKEN}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Composer UI ───────────────────────────────────────────────────────────
  # AUTH_ENABLED=false - a local tutorial stack, not a multi-user deployment.
  scarlet-composer:
    image: ghcr.io/disys-lab/scarlet-composer:${COMPOSER_VERSION:-latest}
    container_name: scarlet-notebooks-composer
    restart: unless-stopped
    ports:
      - "8501:3000"
    environment:
      AUTH_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH_TOKEN: ${REDIS_AUTH_TOKEN}
    depends_on:
      redis:
        condition: service_healthy

  # ─── JupyterLab ────────────────────────────────────────────────────────────
  # All six tutorial notebooks are baked into the image at /notebooks.
  #
  # The mounts exist so notebook 06 can bring the agents profile up from
  # inside this container, and so the CSVs it generates reach the workers:
  #   - the Docker socket, so the CLI here drives the host's daemon
  #   - this directory, so there is a compose file to point -f at
  #   - csv-data, the same volume the workers read their data from
  # Notebooks 01-05 use none of them.
  jupyter:
    image: ghcr.io/disys-lab/scarlet-notebooks:${NOTEBOOKS_VERSION:-latest}
    container_name: scarlet-notebooks-jupyter
    restart: unless-stopped
    ports:
      - "8888:8888"
    # Deliberately NOT `env_file: .env`. Compose resolves env_file relative
    # to the compose file's own directory, and notebook 06 runs
    # `docker compose -f /workspace/docker-compose.yml` from INSIDE this
    # container, where that path is /workspace/.env - so every agent
    # bring-up would die with "env file not found". Explicit ${...}
    # interpolation works in both directions instead: on the host Compose
    # fills these from the implicit ./.env, and from inside this container
    # they come from this process's own environment.
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH_TOKEN: ${REDIS_AUTH_TOKEN}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # The same identity settings gustavo-app.yaml sets on its notebook
      # app. Head and workers are separate deployments with separate
      # APP_IDs, so each prefix is named on its own - one shared APP_ID
      # cannot produce both ids.
      HEAD_APP_ID: ${HEAD_APP_ID:-scarlet-agent-head}
      WORKER_APP_ID: ${WORKER_APP_ID:-scarlet-agent-worker}
      HEAD_NODE_ADDRESS: ${HEAD_NODE_ADDRESS:-head}
      WORKER_NODE_ADDRESSES: ${WORKER_NODE_ADDRESSES:-worker1,worker2}
      HEAD_BUS: ${HEAD_BUS:-scarlet-agent-tutorial_headagent}
      DEVICE_GROUP: ${DEVICE_GROUP:-scarlet-agent-tutorial_subagent}
      HEAD_HOST: agent-head
      HEAD_MCP_PORT: "8090"
      # false here: this compose file is the local path, so the notebook
      # owns the fleet's lifecycle. gustavo-app.yaml sets this true.
      GUSTAVO_MANAGED_AGENTS: "false"
      COMPOSE_FILE_PATH: /workspace/docker-compose.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # This whole directory, not just docker-compose.yml on its own.
      # Bind-mounting a single FILE pins its inode, and any editor that
      # writes by replace-and-rename leaves the container reading a stale
      # or truncated copy.
      - ./:/workspace:ro
      # Read-write here, read-only on the workers: notebook 06 generates
      # each worker's CSV into this volume. Under Gustavo the same role is
      # played by a shared host directory mounted into both.
      - csv-data:/data
    depends_on:
      redis:
        condition: service_healthy

  # ─── Notebook 06's agent fleet (profile: agents) ───────────────────────────
  # Not started by `docker compose up`. Notebook 06 brings these in with
  # `docker compose --profile agents up -d --no-deps`.

  # The head runs mcp_server.py explicitly: scarlet-agents' default CMD
  # (supervisord -> __main__.py) never exposes MCP at all, and __main__.py's
  # ROLE=head branch is an interactive stdin REPL that has no purpose in a
  # detached container. gustavo-app.yaml carries the same override.
  agent-head:
    image: ghcr.io/disys-lab/scarlet-agents:${AGENTS_VERSION:-latest}
    container_name: scarlet-notebooks-agent-head
    restart: unless-stopped
    profiles: ["agents"]
    command: ["python", "-m", "scarlet_agentic_harness.mcp_server"]
    environment:
      APP_ID: ${HEAD_APP_ID:-scarlet-agent-head}
      ROLE: head
      NODE_ADDRESS: ${HEAD_NODE_ADDRESS:-head}
      HEAD_BUS: ${HEAD_BUS:-scarlet-agent-tutorial_headagent}
      DEVICE_GROUP: ${DEVICE_GROUP:-scarlet-agent-tutorial_subagent}
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8090"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH_TOKEN: ${REDIS_AUTH_TOKEN}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      redis:
        condition: service_healthy

  # Workers use the image's default command - ROLE=worker is already the
  # default. CSV_PATH points at the file notebook 06 writes into csv-data,
  # named after this worker's NODE_ADDRESS.
  agent-worker1:
    image: ghcr.io/disys-lab/scarlet-agents:${AGENTS_VERSION:-latest}
    container_name: scarlet-notebooks-agent-worker1
    restart: unless-stopped
    profiles: ["agents"]
    environment:
      APP_ID: ${WORKER_APP_ID:-scarlet-agent-worker}
      ROLE: worker
      NODE_ADDRESS: worker1
      CSV_PATH: /data/worker1.csv
      HEAD_BUS: ${HEAD_BUS:-scarlet-agent-tutorial_headagent}
      DEVICE_GROUP: ${DEVICE_GROUP:-scarlet-agent-tutorial_subagent}
      ACTIVITY_MAPPER: ${ACTIVITY_MAPPER:-scarlet-agent-tutorial_activity}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH_TOKEN: ${REDIS_AUTH_TOKEN}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - csv-data:/data:ro
    depends_on:
      redis:
        condition: service_healthy

  agent-worker2:
    image: ghcr.io/disys-lab/scarlet-agents:${AGENTS_VERSION:-latest}
    container_name: scarlet-notebooks-agent-worker2
    restart: unless-stopped
    profiles: ["agents"]
    environment:
      APP_ID: ${WORKER_APP_ID:-scarlet-agent-worker}
      ROLE: worker
      NODE_ADDRESS: worker2
      CSV_PATH: /data/worker2.csv
      HEAD_BUS: ${HEAD_BUS:-scarlet-agent-tutorial_headagent}
      DEVICE_GROUP: ${DEVICE_GROUP:-scarlet-agent-tutorial_subagent}
      ACTIVITY_MAPPER: ${ACTIVITY_MAPPER:-scarlet-agent-tutorial_activity}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH_TOKEN: ${REDIS_AUTH_TOKEN}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - csv-data:/data:ro
    depends_on:
      redis:
        condition: service_healthy

volumes:
  # Each worker's private CSV, written by notebook 06 at runtime rather
  # than shipped in the repo or baked into an image - the tutorial's data
  # is a property of the tutorial, not of any container.
  csv-data:
  # Redis persistence. See the redis service's own comment for why this
  # is not optional.
  redis-data:
