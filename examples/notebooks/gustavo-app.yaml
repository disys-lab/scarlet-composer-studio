# Scarlet Composer Studio — notebook tutorials, deployed through Gustavo
#
# The multi-node counterpart to docker-compose.yml in this same directory.
# Both declare the same topology; this one hands it to Gustavo so the
# containers land on real edge nodes instead of one host's Docker daemon.
#
#   gustavo apps create -f gustavo-app.yaml -n <app-name> -d <device-group>
#
# One top-level key per app - Gustavo treats each as its own deployable
# unit, so the workers can sit on different device groups than the head.
#
# ─── Why every name here is spelled out ─────────────────────────────────────
#
# Gustavo OVERWRITES APP_ID with the app's own name, unconditionally:
#
#     env_vars = dict(config.get("env_vars") or {})
#     env_vars["APP_ID"] = req.name          # gustavo/api/routers/apps.py
#
# It is the only key Gustavo touches - everything else here passes through
# untouched. So APP_ID is not yours to set, and anything the harness
# *derives* from it differs per app:
#
#     device_group    = DEVICE_GROUP    or f"{app_id}_subagent"
#     head_bus        = HEAD_BUS        or f"{app_id}_headagent"
#     activity_mapper = ACTIVITY_MAPPER or f"{app_id}_activity"
#
# Left to the defaults, a head app and a worker app land on *different*
# buses and never see each other - the head broadcasts into one namespace
# while the worker listens on another, with no error anywhere to say so.
# Setting HEAD_BUS and DEVICE_GROUP to the same values on every app below
# is what makes them one fleet. Do not omit them.
#
# NODE_ADDRESS is also set explicitly. Left unset it is resolved from
# Nebula at boot (config.py's _resolve_node_address), so agent ids would
# be whatever the overlay assigns - unpredictable, and impossible to list
# in EXPECTED_AGENT_IDS below.
#
# Redis is not declared here: Gustavo runs it as a platform service and
# injects the connection settings, which is also why no REDIS_AUTH_TOKEN
# appears in this file.

# ─── JupyterLab ─────────────────────────────────────────────────────────────
scarlet-notebooks:
    docker_image: "ghcr.io/disys-lab/scarlet-notebooks:latest"
    env_vars:
        # Tells notebook 06 that Gustavo owns the fleet's lifecycle: it
        # waits for the agents to appear on the bus rather than starting
        # them, and its teardown cell leaves them alone.
        GUSTAVO_MANAGED_AGENTS: "true"

        # The agent ids to wait for, verbatim. These cannot be composed
        # from a single APP_ID here the way they can under compose,
        # because each app below has its own Gustavo-assigned APP_ID.
        # Each entry is "{that app's name}_{its NODE_ADDRESS}".
        EXPECTED_AGENT_IDS: "scarlet-agent-head_head,scarlet-agent-worker1_worker1,scarlet-agent-worker2_worker2"

        # Must match the agent apps below.
        HEAD_BUS: "scarlet-agent-tutorial_headagent"

        # Where the head's MCP server is reachable - a service name under
        # compose, here whatever resolves to the head container on your
        # Nebula network.
        HEAD_HOST: "scarlet-agent-head"
        HEAD_MCP_PORT: "8090"
    networks:
        - "nebula"
    volumes: []
    starting_ports:
        - 8888: 8888
    running: True
    rolling_restart: True
    containers_per:
        server: 1
    privileged: False
    devices: []

# ─── Agent head ─────────────────────────────────────────────────────────────
# Runs mcp_server.py explicitly: scarlet-agents' default CMD (supervisord
# -> __main__.py) never exposes MCP, and __main__.py's ROLE=head branch is
# an interactive stdin REPL that would crash-loop detached. See
# harness/Dockerfile's own comment on both.
scarlet-agent-head:
    docker_image: "ghcr.io/disys-lab/scarlet-agents:latest"
    command:
        - "python"
        - "-m"
        - "scarlet_agentic_harness.mcp_server"
    env_vars:
        ROLE: "head"
        NODE_ADDRESS: "head"
        HEAD_BUS: "scarlet-agent-tutorial_headagent"
        DEVICE_GROUP: "scarlet-agent-tutorial_subagent"
        MCP_TRANSPORT: "streamable-http"
        MCP_HOST: "0.0.0.0"
        MCP_PORT: "8090"
        # The head is the only container that ever sees the LLM
        # credential; workers never need one to run sum/median.
        LLM_BASE_URL: "https://your-llm-endpoint/v1"
        LLM_API_KEY: "replace-me"
        LLM_MODEL: "your-model-name"
        # No ACTIVITY_MAPPER: the head publishes no activity at all (it
        # builds no CancellationRegistry - see mcp_server.py), so it has
        # nothing to advertise and the field is correctly absent from its
        # status record.
    networks:
        - "nebula"
    volumes: []
    starting_ports:
        - 8090: 8090
    running: True
    rolling_restart: True
    containers_per:
        server: 1
    privileged: False
    devices: []

# ─── Workers ────────────────────────────────────────────────────────────────
# Default command unchanged - ROLE=worker is already the image default.
#
# CSV_PATH points at data that already exists on the node. Unlike the
# compose path, where notebook 06 generates both CSVs into a shared
# volume, here the data does not move - which is rather the point of
# deploying through Gustavo: the agent goes to the data.
#
# ACTIVITY_MAPPER is identical on both workers so their in-flight activity
# lands in one Mapper. Omit it and each worker derives its own from its
# own app name, fragmenting the fleet's activity into one Mapper per app.
scarlet-agent-worker1:
    docker_image: "ghcr.io/disys-lab/scarlet-agents:latest"
    env_vars:
        ROLE: "worker"
        NODE_ADDRESS: "worker1"
        HEAD_BUS: "scarlet-agent-tutorial_headagent"
        DEVICE_GROUP: "scarlet-agent-tutorial_subagent"
        ACTIVITY_MAPPER: "scarlet-agent-tutorial_activity"
        CSV_PATH: "/data/readings.csv"
    networks:
        - "nebula"
    volumes:
        - "/var/lib/scarlet-tutorial/worker1:/data:ro"
    running: True
    rolling_restart: True
    containers_per:
        server: 1
    privileged: False
    devices: []

scarlet-agent-worker2:
    docker_image: "ghcr.io/disys-lab/scarlet-agents:latest"
    env_vars:
        ROLE: "worker"
        NODE_ADDRESS: "worker2"
        HEAD_BUS: "scarlet-agent-tutorial_headagent"
        DEVICE_GROUP: "scarlet-agent-tutorial_subagent"
        ACTIVITY_MAPPER: "scarlet-agent-tutorial_activity"
        CSV_PATH: "/data/readings.csv"
    networks:
        - "nebula"
    volumes:
        - "/var/lib/scarlet-tutorial/worker2:/data:ro"
    running: True
    rolling_restart: True
    containers_per:
        server: 1
    privileged: False
    devices: []
