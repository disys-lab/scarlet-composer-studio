[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3

[program:scarlet_agentic_harness]
command=python3 -m scarlet_agentic_harness
directory=/app
autostart=true
autorestart=true
startretries=5
stderr_logfile=/var/log/supervisor/scarlet_agentic_harness.err
stdout_logfile=/var/log/supervisor/scarlet_agentic_harness.out
