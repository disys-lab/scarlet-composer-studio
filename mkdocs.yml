site_name: Scarlet Composer Studio
site_description: Distributed shared memory and agent communication for multi-agent systems
site_author: Paritosh Ramanan
repo_url: https://github.com/disys-lab/scarlet-composer-studio
repo_name: disys-lab/scarlet-composer-studio
edit_uri: edit/main/docs/

# Local development:
#   pip install -r docs/requirements.txt
#   mkdocs serve
#
# Deploy to GitHub Pages:
#   mkdocs gh-deploy --force

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [".", "harness"]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            merge_init_into_class: true
            docstring_section_style: table
            members_order: source
            separate_signature: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - Getting Started:
    - Quickstart (Docker Compose): quickstart.md
    - Installation: installation.md
  - Concepts:
    - Scarlet Primitives: concepts/scarlets.md
    - Two-Channel Architecture: concepts/two-channel.md
    - Campaign Isolation: concepts/campaigns.md
    - Node Identity: concepts/identity.md
  - Guides:
    - Federated Aggregation: guides/federation.md
    - LLM / MCP Integration: guides/llm-integration.md
    - Scarlet Declarations: guides/declarations.md
  - Deployment:
    - Docker Images: deployment/docker.md
    - Gustavo Integration: deployment/gustavo.md
    - Multi-Node Edge: deployment/multi-node.md
    - Environment Variables: deployment/env-vars.md
  - Composer UI:
    - Overview: composer/index.md
    - Agents: composer/agents.md
    - Data Sources: composer/data-sources.md
    - Logging: composer/logging.md
  - Harness:
    - Introduction: harness/index.md
    - Core Concepts: harness/concepts.md
    - Getting Started: harness/getting-started.md
    - Deployment: harness/deployment.md
  - Reference:
    - Overview: reference/api.md
    - Scarlets API: reference/scarlets-api.md
    - Harness API: reference/harness-api.md
    - Data Connectors API: reference/data-connectors-api.md
    - CLI Reference: reference/cli.md
    - Redis Key Schema: reference/redis-schema.md
  - Contributing: contributing.md

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - toc.integrate
    - search.highlight
    - search.share

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

extra_css:
  - assets/extra.css
