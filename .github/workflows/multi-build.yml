# Adapted from disys-lab/gustavo's .github/workflows/multi-build.yml -
# same staged-job structure (bumpversion -> linuxbuild/macbuild ->
# dockerbuild, each gated on a commit-message catchphrase) applied to this
# repo's two published artifacts (the scarlets/scarletcomposer wheels, and
# the two Docker images built from them: ghcr.io/disys-lab/scarlet-agent-base
# and ghcr.io/disys-lab/scarlet-composer).
#
# Two real differences from gustavo's version, not just a straight copy:
#   1. gustavo's own dockerbuild only ever built --platform linux/amd64,
#      despite the "#dockerbuild" name - this one genuinely builds and
#      pushes a linux/amd64,linux/arm64 multi-arch manifest, via
#      docker/build-push-action's native multi-platform support (buildx),
#      not a hand-rolled per-arch script.
#   2. Catchphrases are scoped per image (agent-* / composer-*) rather than
#      gustavo's single global set, since this repo builds two independent
#      images from two independent Dockerfiles - see the README section
#      this change's PR/commit links back to for the full trigger list.
#
# Version bump (#agent-bump / #composer-bump) is shared across both images
# on purpose: both packages already share one version line via
# setuptools-scm (git-tag-derived - see setup.py/setup_composer.py), so
# there's only one counter to bump regardless of which image asked for it.
#
# Docker build args use LOCAL=true with a wheel built earlier in the same
# run (via actions/upload-artifact / download-artifact) - NOT LOCAL=false's
# "install from Gemfury in production" path. That path is currently a gap
# in both docker/agent-base/Dockerfile and docker/composer/Dockerfile: the
# else-branch's own comment says it installs scarlets from Gemfury, but the
# actual command only installs scarlets' *dependencies* (redis numpy
# requests), never scarlets itself - a pre-existing issue, not something
# this workflow works around by accident. LOCAL=true sidesteps it entirely
# and is also more hermetic (doesn't depend on Gemfury's own availability/
# propagation delay at build time).

name: Multi-Arch Build

on:
  push:
    branches: ["main", "master"]

jobs:
  bumpversion:
    if: contains(github.event.head_commit.message, '#agent-bump') || contains(github.event.head_commit.message, '#composer-bump')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          PRERELEASE: true
          # This repo currently has zero tags (confirmed via the GitHub
          # API, not just local git) even though 0.5.0 is already the
          # published baseline (ghcr.io/disys-lab/scarlet-agent-base:0.5.0
          # and scarlet-composer:0.5.0 already exist, and setup.py/
          # setup_composer.py's own fallback_version is "0.5.0"). Without
          # this, the action's own default INITIAL_VERSION (0.0.0) would
          # make the very first bump produce v0.0.1 - disconnected from
          # what's already published. No "v" prefix here even though
          # WITH_V is true - the action adds that separately.
          INITIAL_VERSION: "0.5.0"

  # ── scarlet-agent-base ───────────────────────────────────────────────────

  agent-linuxbuild:
    needs: bumpversion
    # always() + explicit needs.bumpversion.result check, not a plain
    # contains(...) - confirmed by a real run that GitHub Actions skips a
    # downstream job by default whenever a needed job was skipped (bump
    # only runs on #agent-bump/#composer-bump, so a commit with only
    # #agent-linuxbuild would otherwise skip this too, cascading through
    # every job below it). success() alone doesn't cover a *skipped*
    # bumpversion, only a *succeeded* one.
    if: always() && contains(github.event.head_commit.message, '#agent-linuxbuild') && (needs.bumpversion.result == 'success' || needs.bumpversion.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build scarlets wheel
        env:
          GEMFURY_TOKEN: ${{ secrets.GEMFURY_TOKEN }}
        run: |
          pip install setuptools wheel setuptools-scm
          pip install -r requirements.txt
          python3 builder.py setup.py "$GEMFURY_TOKEN"
      # scarlets/scarletcomposer are pure-Python (no compiled extensions -
      # see requirements.txt), so every matrix leg produces an identical
      # py3-none-any wheel; running the full OS x Python matrix validates
      # clean installs across all of them, but only one leg's wheel needs
      # to feed the docker build below.
      - name: Upload wheel artifact
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: scarlets-wheel
          path: dist/scarlets-*.whl

  agent-macbuild:
    needs: bumpversion
    if: always() && contains(github.event.head_commit.message, '#agent-macbuild') && (needs.bumpversion.result == 'success' || needs.bumpversion.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-13, macos-14, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build scarlets wheel
        env:
          GEMFURY_TOKEN: ${{ secrets.GEMFURY_TOKEN }}
        run: |
          pip3 install setuptools wheel setuptools-scm
          pip3 install -r requirements.txt
          python3 builder.py setup.py "$GEMFURY_TOKEN"

  agent-dockerbuild:
    needs: agent-linuxbuild
    # Deliberately requires needs.agent-linuxbuild.result == 'success'
    # specifically here (not also 'skipped', unlike the *build jobs above) -
    # this job needs the wheel artifact agent-linuxbuild uploads, so it must
    # not run if that job didn't actually run and succeed.
    if: always() && contains(github.event.head_commit.message, '#agent-dockerbuild') && needs.agent-linuxbuild.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download scarlets wheel
        uses: actions/download-artifact@v4
        with:
          name: scarlets-wheel
          path: dist
      # Parsed from the actual downloaded wheel's filename, not recomputed
      # separately (was `git describe --tags --abbrev=0`, stripped of its
      # "v" prefix) - found by a real run to diverge from what
      # setuptools-scm actually named the wheel whenever this commit isn't
      # *exactly* the tagged commit (e.g. a docker-only retry with no
      # #agent-bump in the same commit): git describe --abbrev=0 just names
      # the nearest tag regardless of commit distance, while
      # setuptools-scm bumps to a dev-suffixed next version the moment
      # HEAD is even one commit past the tag - VERSION=0.5.1 was passed to
      # a wheel actually named scarlets-0.5.2.dev3+g<hash>-py3-none-any.whl,
      # and the Dockerfile's own pip install glob matched nothing. A bare
      # `python -m setuptools_scm` isn't a fix either - it doesn't read
      # setup.py's own use_scm_version config without a pyproject.toml,
      # so it computes yet another, still-different, still-wrong version.
      # docker_tag is a *separate* output from version - a setuptools-scm
      # dev version contains a literal "+" (e.g. 0.5.2.dev3+gc6174a400),
      # which Docker's own tag reference format rejects outright
      # ("invalid reference format", confirmed against a real `docker
      # tag`). The build-arg below needs the raw version verbatim (the
      # Dockerfile's pip install glob must match the wheel's real
      # filename); the image tag needs the sanitized form.
      - name: Determine version
        id: version
        run: |
          WHEEL=$(ls dist/scarlets-*.whl | head -1)
          VERSION=$(basename "$WHEEL" | sed -E 's/^scarlets-(.+)-py3-none-any\.whl$/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${VERSION//+/-}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent-base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            LOCAL=true
          tags: |
            ghcr.io/disys-lab/scarlet-agent-base:${{ steps.version.outputs.docker_tag }}
            ghcr.io/disys-lab/scarlet-agent-base:latest

  # ── scarlet-composer ─────────────────────────────────────────────────────

  composer-linuxbuild:
    needs: bumpversion
    if: always() && contains(github.event.head_commit.message, '#composer-linuxbuild') && (needs.bumpversion.result == 'success' || needs.bumpversion.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # scarlet-composer's image needs both wheels (it depends on scarlets -
      # see setup_composer.py's install_requires and docker/composer/Dockerfile's
      # LOCAL=true step) - build both here so a single artifact covers it.
      - name: Build scarlets + scarletcomposer wheels
        env:
          GEMFURY_TOKEN: ${{ secrets.GEMFURY_TOKEN }}
        run: |
          pip install setuptools wheel setuptools-scm
          pip install -r requirements.txt
          python3 builder.py setup.py "$GEMFURY_TOKEN"
          python3 builder.py setup_composer.py "$GEMFURY_TOKEN"
      - name: Upload wheel artifacts
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: composer-wheels
          path: |
            dist/scarlets-*.whl
            dist/scarletcomposer-*.whl

  composer-macbuild:
    needs: bumpversion
    if: always() && contains(github.event.head_commit.message, '#composer-macbuild') && (needs.bumpversion.result == 'success' || needs.bumpversion.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-13, macos-14, macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build scarlets + scarletcomposer wheels
        env:
          GEMFURY_TOKEN: ${{ secrets.GEMFURY_TOKEN }}
        run: |
          pip3 install setuptools wheel setuptools-scm
          pip3 install -r requirements.txt
          python3 builder.py setup.py "$GEMFURY_TOKEN"
          python3 builder.py setup_composer.py "$GEMFURY_TOKEN"

  composer-dockerbuild:
    needs: composer-linuxbuild
    if: always() && contains(github.event.head_commit.message, '#composer-dockerbuild') && needs.composer-linuxbuild.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: composer-wheels
          path: dist
      # Parsed from the actual downloaded wheel - see agent-dockerbuild's
      # Determine version step for why (git describe --abbrev=0 can name a
      # different version than what setuptools-scm actually gave the wheel).
      - name: Determine version
        id: version
        run: |
          WHEEL=$(ls dist/scarletcomposer-*.whl | head -1)
          VERSION=$(basename "$WHEEL" | sed -E 's/^scarletcomposer-(.+)-py3-none-any\.whl$/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${VERSION//+/-}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/composer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            LOCAL=true
          tags: |
            ghcr.io/disys-lab/scarlet-composer:${{ steps.version.outputs.docker_tag }}
            ghcr.io/disys-lab/scarlet-composer:latest
